<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main Admin Panel · MultiEats</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap" id="panel" style="display:none"><h2 style="margin-top:0">Main Admin / Restaurant Panel</h2><div class="muted">System-wide monitoring only</div><div class="tabs" id="tabs"></div><div id="c"></div></div><script src="js/config.js"></script><script src="js/common.js"></script><script>
const ALLOWED=isAdmin();if(!ALLOWED)location.replace(getUser()?'index.html':'login.html?next=admin.html');else{$('#panel').style.display='';nav('admin')}
const T={dash:'📊 Dashboard',cust:'👥 Customer Activity',rest:'🍴 Restaurant Activity',pay:'💰 Settlements'},sc={pending:'y',preparing:'b',ready:'b',delivered:'g',cancelled:'r',completed:'g',confirmed:'g',assigned:'g',picked_up:'b',held:'y',payable:'b',paid:'b',disputed:'r',refunded:'d'};
const pill=s=>s?`<span class="pill ${sc[s]||''}">${esc(String(s).replace('_',' '))}</span>`:'<span class="muted">—</span>';const dt=d=>d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const wrap=h=>`<div class="card tbl-wrap">${h}</div>`;let CUR='dash';const OUT={pending:'Pending (not accepted yet)',preparing:'Accepted / preparing',ready:'Ready for pickup',delivered:'Delivered ✓',cancelled:'Rejected / cancelled'};
function tab(k){CUR=k;$('#tabs').innerHTML=Object.entries(T).map(([a,b])=>`<button class="${a===k?'on':''}" onclick="tab('${a}')">${b}</button>`).join('');Promise.resolve(V[k]()).catch(e=>$('#c').innerHTML=`<div class="alert bad">${esc(e.message)}</div>`)}
const V={
async dash(){const [d,opc]=await Promise.all([api('/platform/dashboard'),api('/platform/orders-per-customer')]),card=(t,v)=>`<div class="card"><span class="muted">${t}</span><b>${v}</b></div>`;$('#c').innerHTML=`<div class="stat wide">${card('Restaurants',d.restaurants)}${card('Customers',d.customers)}${card('Restaurant owners',d.restaurant_owners)}${card('Orders',d.orders)}${card('Active orders',d.active_orders)}${card('Deliveries assigned',d.deliveries_assigned)}${card('Waiting for delivery partner',d.deliveries_waiting)}</div>${barChart('Orders per customer',opc)}<div class="card pad"><h3 style="margin-top:0">Main Admin</h3><p class="muted">Monitor customers, restaurants, orders and the single-delivery assignment across the entire MultiEats system. Customer shopping pages are intentionally not shown.</p></div>`},
async pay(){const d=await api('/platform/settlements'),s=d.summary,card=(t,v,h)=>`<div class="card"><span class="muted">${t}</span><b>${money(v)}</b><div class="muted">${h}</div></div>`;
$('#c').innerHTML=`<div class="note">🔒 <b>One payment, held by MultiEats.</b> Customers pay MultiEats. Each restaurant's share is held until that restaurant delivers, then it becomes <b>payable</b> and MultiEats pays that restaurant <b>directly</b>. The first/main restaurant never receives other restaurants' money, so it cannot withhold it.</div>
<div class="stat wide">${card('Held in escrow',s.held,'not delivered yet')}${card('Payable now',s.payable,s.overdue?`<span style="color:var(--bad)">${s.overdue} overdue</span>`:'delivered, awaiting payout')}${card('Paid out',s.paid,'waiting for restaurant to confirm')}${card('Confirmed',s.confirmed,'restaurant received it')}${card('Disputes',s.disputed,s.disputes+' open')}${card('Commission earned',s.commission,'MultiEats')}</div>
<div class="row" style="margin-bottom:12px"><h3 style="margin:0">Restaurant payouts</h3>${+s.payable>0?`<button onclick="relAll()">Release all payable (${money(s.payable)})</button>`:'<button disabled style="opacity:.5;cursor:not-allowed" title="Every delivered share is already paid">Nothing to release</button>'}</div>
${wrap(`<table><tr><th>Restaurant</th><th>Order</th><th>Sales</th><th>Commission</th><th>Payout</th><th>Status</th><th>Details</th><th>Action</th></tr>${d.rows.map(x=>`<tr><td>${esc(x.restaurant)}</td><td>#${x.order_id}<div class="muted">Sub-order #${x.sub_order_id}</div></td><td>${money(x.gross_amount)}</td><td>${money(x.commission_amount)}</td><td><b>${money(x.net_amount)}</b></td><td>${pill(x.status)}${x.overdue?' <span class="pill r">overdue</span>':''}</td><td>${x.payout_ref?`${esc(x.payout_ref)}<div class="muted">${dt(x.paid_at)}</div>`:'—'}${x.dispute_note?`<div class="muted">Restaurant says: ${esc(x.dispute_note)}</div>`:''}</td><td>${x.status==='payable'?`<button class="sm" onclick="rel(${x.settlement_id})">Release payout</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No settlements yet</td></tr>'}</table>`)}`},
async cust(){const rows=await api('/platform/customer-activity');$('#c').innerHTML=wrap(`<table><tr><th>Order</th><th>Date / time</th><th>Customer</th><th>Delivery address</th><th>Restaurants</th><th>Items / quantity</th><th>Order status</th><th>Delivery</th></tr>${rows.map(x=>`<tr><td>#${x.order_id}</td><td>${dt(x.created_at)}</td><td>${esc(x.customer)}<div class="muted">${esc(x.customer_email||'')}</div></td><td>${esc(x.delivery_address||'—')}</td><td>${esc(x.restaurants)}</td><td>${esc(x.items)}</td><td>${pill(x.overall_status)}</td><td>${x.delivery_partner?`<b>${esc(x.delivery_partner)}</b><br>${pill(x.delivery_status)}`:esc(x.delivery_assignment_status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No customer activity</td></tr>'}</table>`)},
async rest(){const rows=await api('/platform/restaurant-activity');$('#c').innerHTML=wrap(`<table><tr><th>Restaurant</th><th>Order</th><th>Customer</th><th>Items</th><th>Order time</th><th>Sub-order status</th><th>Outcome</th><th>Delivery</th></tr>${rows.map(x=>`<tr><td>${esc(x.restaurant)}</td><td>#${x.order_id}<div class="muted">Sub-order #${x.sub_order_id}</div></td><td>${esc(x.customer)}</td><td>${esc(x.items)}</td><td>${dt(x.created_at)}</td><td>${pill(x.sub_status)}</td><td>${OUT[x.sub_status]||esc(x.sub_status)}</td><td>${x.delivery_partner?`<b>${esc(x.delivery_partner)}</b><br>${pill(x.delivery_status)}`:esc(x.delivery_assignment_status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No restaurant activity</td></tr>'}</table>`)}}
async function rel(id){const ref=prompt('Bank / UPI reference (optional)','');if(ref===null)return;try{await api(`/platform/settlements/${id}/release`,{method:'POST',body:{ref}});toast('Payout released');tab('pay')}catch(e){toast(e.message,'bad')}}
async function relAll(){if(!confirm('Release ALL payable shares to their restaurants?'))return;try{const r=await api('/platform/settlements/release-all',{method:'POST'});if(!r.count)toast('Nothing to release: no payable payouts','bad');else toast(`Released ${r.count} payouts (${money(r.total)})`);tab('pay')}catch(e){toast(e.message,'bad')}}
if(ALLOWED)tab('dash');</script></body></html>
