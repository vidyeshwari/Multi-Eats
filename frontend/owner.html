
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Owner Dashboard · MultiEats</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap" id="panel" style="display:none"><h2 style="margin-top:0">Restaurant Owner Dashboard</h2><div class="muted" id="who"></div><div id="picker"></div><div class="tabs" id="tabs"></div><div id="c"></div></div><script src="js/config.js"></script><script src="js/common.js"></script><script>
const ALLOWED=isStaff();if(!ALLOWED)location.replace(getUser()?'index.html':'login.html?next=owner.html');else{$('#panel').style.display='';nav('owner')}
const T={dash:'📊 Dashboard',orders:'🧾 Orders',pay:'💰 Payouts',menu:'📖 Menu',rest:'🍴 My Restaurant',new:'➕ New Restaurant'},sc={pending:'y',preparing:'b',ready:'b',delivered:'g',cancelled:'r',paid:'g',unpaid:'y',held:'y',payable:'b',confirmed:'g',disputed:'r',refunded:'d'};const pill=s=>s?`<span class="pill ${sc[s]||''}">${esc(String(s).replace('_',' '))}</span>`:'<span class="muted">—</span>';const dt=d=>d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';const wrap=h=>`<div class="card tbl-wrap">${h}</div>`;let CUR='dash',REST=null;
// ONE shared restaurant login: after login the person picks a restaurant and only that restaurant's panel is shown.
const PORTAL=!!(getUser()&&getUser().portal);let SEL=PORTAL?sessionStorage.getItem('rid'):null;
const ensureSel=()=>PORTAL&&SEL?api('/portal/select',{method:'POST',body:{restaurant_id:+SEL}}):Promise.resolve();
async function initPicker(){if(!PORTAL)return;try{const d=await api('/portal/restaurants');
 $('#picker').innerHTML=`<div class="card pad picker"><b>Restaurant:</b><select id="rsel"><option value="">— Select a restaurant —</option>${d.restaurants.map(r=>`<option value="${r.restaurant_id}" ${String(r.restaurant_id)===String(SEL)?'selected':''}>${esc(r.name)}${r.area?' · '+esc(r.area):''}</option>`).join('')}</select><span class="muted">You will see only the selected restaurant's panel.</span></div>`;
 $('#rsel').onchange=e=>{SEL=e.target.value||null;REST=null;SEL?sessionStorage.setItem('rid',SEL):sessionStorage.removeItem('rid');tab(SEL?'dash':CUR)}}catch(e){$('#c').innerHTML=`<div class="alert bad">${esc(e.message)}</div>`}}
function tab(k){CUR=k;$('#tabs').innerHTML=Object.entries(T).filter(([a])=>a!=='new'||PORTAL).map(([a,b])=>`<button class="${a===k?'on':''}" onclick="tab('${a}')">${b}</button>`).join('');if(PORTAL&&!SEL&&k!=='new'){$('#who').textContent='';$('#c').innerHTML='<div class="note">👆 Select a restaurant above to open its panel.</div>';return}
ensureSel().then(()=>V[k]()).catch(e=>$('#c').innerHTML=`<div class="alert bad">${esc(e.message)}</div>`)}
const V={
async dash(){const [d,rv,rs,opc]=await Promise.all([api('/admin/dashboard'),api('/admin/reports/revenue'),api('/admin/restaurants'),api('/admin/orders-per-customer')]);REST=rs[0];$('#who').innerHTML=`Managing: <b>${esc(REST?.name||'Your restaurant')}</b> — only this restaurant's data is available.`;const s=rv.summary||{},card=(t,v)=>`<div class="card"><span class="muted">${t}</span><b>${v}</b></div>`;$('#c').innerHTML=`<div class="stat wide">${card('Orders',s.orders||0)}${card('Sales',money(s.gross))}${card('Menu items',d.menu_items||0)}${card('Active orders',d.active_orders||0)}</div>${barChart('Orders per customer',opc)}<div class="card pad"><h3 style="margin-top:0">Restaurant responsibilities</h3><p class="muted">Accept/reject and process only your restaurant's sub-orders. If your restaurant is the first/main restaurant in a multi-restaurant order, you can assign the single delivery partner for the entire order.</p></div>`},
async orders(){const d=await api('/admin/orders');$('#c').innerHTML=wrap(`<table><tr><th>Order</th><th>Placed</th><th>Customer</th><th>Delivery address</th><th>Your amount</th><th>Your status</th><th>Delivery</th><th>Action</th></tr>${d.map(o=>`<tr><td>#${o.order_id}<div class="muted">Sub-order #${o.sub_order_id}</div></td><td>${dt(o.created_at)}</td><td>${esc(o.customer)}<div class="muted">${esc(o.phone||'')}</div></td><td>${esc(o.delivery_address||'—')}</td><td><b>${money(o.sub_amount)}</b></td><td>${pill(o.sub_status)}</td><td>${o.sub_status==='cancelled' ? '<span class="muted">No delivery assigned for cancelled restaurant</span>' : (o.partner?`<b>${esc(o.partner)}</b><br>${pill(o.delivery_status)}`:esc(o.delivery_assignment_status))}</td><td>${o.sub_status==='cancelled'?'—':o.sub_status==='delivered'?'<span class="muted">🔒 Delivered · status locked</span>':`<select onchange="setSt(${o.sub_order_id},this.value)" style="width:auto"><option value="">Change…</option><option value="preparing">Accept / Preparing</option><option value="ready">Ready</option><option value="delivered">Delivered</option><option value="cancelled">Reject</option></select>`}${o.can_assign_delivery?`<br><button class="sm" style="margin-top:6px" onclick="assign(${o.order_id})">Assign delivery partner</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No orders for your restaurant</td></tr>'}</table>`)},
async pay(){const d=await api('/admin/settlements'),s=d.summary,card=(t,v,h)=>`<div class="card"><span class="muted">${t}</span><b>${money(v)}</b><div class="muted">${h}</div></div>`;
$('#c').innerHTML=`<div class="note">🔒 Customers pay <b>MultiEats</b>, not any restaurant. Your share is held by MultiEats, becomes <b>payable</b> when you deliver, and MultiEats then pays <b>you directly</b>. No other restaurant ever holds your money. Confirm below when the money reaches you; if it does not, raise a dispute.</div>
<div class="stat wide">${card('Held (not delivered yet)',s.held,'safe with MultiEats')}${card('Payable (delivered)',s.payable,'MultiEats must pay you')}${card('Paid, please confirm',s.paid,'sent by MultiEats')}${card('Confirmed received',s.confirmed,'complete')}${card('Disputed',s.disputed,'under review')}</div>
${wrap(`<table><tr><th>Order</th><th>Your sales</th><th>Commission</th><th>You receive</th><th>Status</th><th>Payout details</th><th>Action</th></tr>${d.rows.map(x=>`<tr><td>#${x.order_id}<div class="muted">Sub-order #${x.sub_order_id}</div></td><td>${money(x.gross_amount)}</td><td>${money(x.commission_amount)}</td><td><b>${money(x.net_amount)}</b></td><td>${pill(x.status)}</td><td>${x.payout_ref?`${esc(x.payout_ref)}<div class="muted">${dt(x.paid_at)}</div>`:'—'}${x.dispute_note?`<div class="muted">Your note: ${esc(x.dispute_note)}</div>`:''}</td><td>${x.status==='paid'?`<button class="sm" onclick="conf(${x.settlement_id},true)">Received</button> <button class="red sm" onclick="conf(${x.settlement_id},false)">Not received</button>`:x.status==='disputed'?`<button class="sm" onclick="conf(${x.settlement_id},true)">Received now</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payouts yet</td></tr>'}</table>`)}`},
async menu(){if(!REST){const rs=await api('/admin/restaurants');REST=rs[0]}const items=REST?await api(`/admin/restaurants/${REST.restaurant_id}/menu`):[];const cats=[...new Set(items.map(i=>i.category))];$('#c').innerHTML=`<div class="card pad"><b>${esc(REST.name)}</b><div class="muted">${esc(REST.area||'')} · ${esc(REST.cuisine_type||'')}</div></div>${wrap(`<table><tr><th>Item</th><th>Category</th><th>Price ₹</th><th>Veg</th><th>Bestseller</th><th>Available</th><th></th></tr>${items.map(i=>`<tr><td><input value="${esc(i.name)}" onchange="upd(${i.item_id},'name',this.value)" style="min-width:190px"><input value="${esc(i.description||'')}" onchange="upd(${i.item_id},'description',this.value)" style="margin-top:4px;min-width:190px"></td><td><input value="${esc(i.category)}" onchange="upd(${i.item_id},'category',this.value)" style="width:110px"></td><td><input type="number" value="${i.price}" onchange="upd(${i.item_id},'price',+this.value)" style="width:90px"></td><td><input type="checkbox" ${i.is_veg?'checked':''} onchange="upd(${i.item_id},'is_veg',this.checked)" style="width:auto"></td><td><input type="checkbox" ${i.is_bestseller?'checked':''} onchange="upd(${i.item_id},'is_bestseller',this.checked)" style="width:auto"></td><td><input type="checkbox" ${i.is_available?'checked':''} onchange="upd(${i.item_id},'is_available',this.checked)" style="width:auto"></td><td><button class="red sm" onclick="delM(${i.item_id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No items yet</td></tr>'}</table>`)}<h3 class="t">➕ Add menu item</h3><div class="card pad" style="max-width:640px"><div class="two-col"><div><label>Item name</label><input id="n"><label>Category</label><input id="ct" list="cl" placeholder="Starters, Mains…"><datalist id="cl">${cats.map(c=>`<option>${esc(c)}`).join('')}</datalist></div><div><label>Description</label><input id="desc"><label>Price (₹)</label><input id="p" type="number"></div></div><label><input id="v" type="checkbox" checked style="width:auto"> Vegetarian</label><label><input id="bs" type="checkbox" style="width:auto"> Bestseller</label><br><button onclick="addM()">Add item</button></div>`},
async new(){$('#who').textContent='';$('#c').innerHTML=`<div class="card pad" style="max-width:760px"><h3 style="margin-top:0">Add a new restaurant</h3><div class="muted">It is created and opened right away; add its menu items next. Fields marked * are required.</div><div class="two-col"><div><label>Name *</label><input id="nr_name" maxlength="120"><label>Area</label><input id="nr_area"><label>Cuisine</label><input id="nr_cuisine"><label>Address</label><input id="nr_address"></div><div><label>Latitude *</label><input id="nr_lat" inputmode="decimal" placeholder="e.g. 18.5204"><label>Longitude *</label><input id="nr_lng" inputmode="decimal" placeholder="e.g. 73.8567"><label>Cost for two (₹)</label><input id="nr_cost" type="number" min="0"><label>Prep time (min)</label><input id="nr_prep" type="number" min="5" max="180" value="20"></div></div><label>Photo URL (optional)</label><input id="nr_photo" placeholder="https://…"><div class="muted" style="margin-top:8px">Tip: in Google Maps, right-click the restaurant and click the coordinates to copy latitude and longitude. They decide which restaurants can be combined in one delivery.</div><br><button onclick="addR()">Create restaurant</button></div>`},
async rest(){const rs=await api('/admin/restaurants');REST=rs[0];if(!REST){$('#c').innerHTML='<div class="alert bad">This account is not linked to a restaurant.</div>';return}$('#c').innerHTML=`<div class="card pad"><h3 style="margin-top:0">${esc(REST.name)}</h3><div class="muted">You can edit only this restaurant.</div><div class="two-col"><div><label>Name</label><input id="e_name" value="${esc(REST.name)}"><label>Area</label><input id="e_area" value="${esc(REST.area||'')}"><label>Cuisine</label><input id="e_cuisine" value="${esc(REST.cuisine_type||'')}"><label>Address</label><input id="e_address" value="${esc(REST.address||'')}"></div><div><label>Cost for two (₹)</label><input id="e_cost" type="number" value="${REST.cost_for_two||''}"><label>Prep time (min)</label><input id="e_prep" type="number" value="${REST.prep_time_min||20}"><label>Photo URL</label><input id="e_photo" value="${esc(REST.photo_url||'')}"></div></div><br><button onclick="saveR()">Save changes</button></div>`}}
async function addR(){const v=id=>$('#'+id).value.trim(),name=v('nr_name'),lat=v('nr_lat'),lng=v('nr_lng');
 if(!name)return toast('Restaurant name is required','bad');
 if(lat===''||lng===''||isNaN(+lat)||isNaN(+lng))return toast('Enter latitude and longitude as numbers','bad');
 if(+lat<-90||+lat>90||+lng<-180||+lng>180)return toast('Latitude or longitude is out of range','bad');
 try{const r=await api('/portal/restaurants',{method:'POST',body:{name,area:v('nr_area'),cuisine_type:v('nr_cuisine'),address:v('nr_address'),lat,lng,cost_for_two:v('nr_cost'),prep_time_min:v('nr_prep'),photo_url:v('nr_photo')}});
  SEL=String(r.restaurant_id);sessionStorage.setItem('rid',SEL);REST=null;await initPicker();toast('Restaurant added. Now add its menu items');tab('menu')}catch(e){toast(e.message,'bad')}}
async function conf(id,ok){let note=null;if(!ok){note=prompt('What went wrong? (e.g. money not received in bank)');if(!note)return}try{await api(`/admin/settlements/${id}/confirm`,{method:'POST',body:{received:ok,note}});toast(ok?'Payout confirmed':'Dispute sent to MultiEats');tab('pay')}catch(e){toast(e.message,'bad')}}
async function setSt(id,s){if(!s)return;const reason=s==='cancelled'?prompt('Reason for rejection/cancellation?','Restaurant unavailable'):null;if(s==='cancelled'&&reason===null)return tab('orders');try{await api(`/sub-orders/${id}/status`,{method:'PATCH',body:{status:s,reason}});toast(s==='cancelled'?'Order rejected and refund credited':'Order status updated');tab('orders')}catch(e){toast(e.message,'bad')}}async function assign(id){try{await api(`/orders/${id}/assign-delivery`,{method:'POST'});toast('Delivery partner assigned');tab('orders')}catch(e){toast(e.message,'bad')}}
const upd=(id,k,v)=>api('/admin/menu-items/'+id,{method:'PATCH',body:{[k]:v}}).then(()=>toast('Saved')).catch(e=>toast(e.message,'bad'));const delM=id=>confirm('Delete this menu item?')&&api('/admin/menu-items/'+id,{method:'DELETE'}).then(()=>{toast('Item deleted');tab('menu')}).catch(e=>toast(e.message,'bad'));const addM=()=>run(api('/admin/menu-items',{method:'POST',body:{name:$('#n').value,category:$('#ct').value||'Main course',description:$('#desc').value,price:+$('#p').value,is_veg:$('#v').checked,is_bestseller:$('#bs').checked}}),'Menu item added','menu');const saveR=()=>run(api('/admin/restaurants/'+REST.restaurant_id,{method:'PATCH',body:{name:$('#e_name').value,area:$('#e_area').value,cuisine_type:$('#e_cuisine').value,address:$('#e_address').value,cost_for_two:$('#e_cost').value,prep_time_min:$('#e_prep').value,photo_url:$('#e_photo').value}}),'Restaurant updated','rest');const run=async(p,ok,again)=>{try{await p;toast(ok);tab(again||CUR)}catch(e){toast(e.message,'bad')}};if(ALLOWED){initPicker();tab('dash')}</script></body></html>
